name: Build Aniken TV with AniLiberty API

on:
  push:
    branches:
      - feature/anikentv-aniliberty-api-v1
    paths:
      - 'anikentv-release/**'
      - '.github/workflows/anikentv-liberty.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK dependencies
        run: |
          SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.1"

      - name: Run adapter unit tests
        working-directory: anikentv-release
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        working-directory: anikentv-release
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anikentv-aniliberty-api-debug
          path: anikentv-release/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
