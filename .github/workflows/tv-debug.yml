name: TV debug APK

on:
  push:
    branches: [style/cleanyourtv]
  pull_request:
    paths:
      - 'app-tv/**'
      - 'gradle/**'
      - '.github/workflows/tv-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Assemble TV debug
        run: bash ./gradlew :app-tv:assembleAppDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AniLiberty-TV-debug
          path: app-tv/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
