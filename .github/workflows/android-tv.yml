name: AniHall Android mobile and TV
on:
  push:
    branches: [rewrite/tv-next, feature/anihall-yummytv-structure]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tv-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AniHall-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AniHall-Android-release-checks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/
          if-no-files-found: warn
